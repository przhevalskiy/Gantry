[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "monolift"
version = "0.1.0"
description = "Monolift Python SDK — submit engineering tasks, get PRs back"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["httpx>=0.27.0"]

[project.urls]
Homepage = "https://monolift.dev"
Repository = "https://github.com/monolift/monolift"

[tool.hatch.build.targets.wheel]
packages = ["gantry"]
