[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gantry"
version = "0.1.0"
description = "Durable parallel AI engineering factory — goal to PR via swarm agents"
requires-python = ">=3.12"

dependencies = [
    "agentex-sdk",
    "anthropic>=0.40.0",
    "temporalio>=1.7.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "psycopg[binary,pool]>=3.2",
    "cryptography>=42.0.0",
    "pyjwt[crypto]>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "debugpy>=1.8.15",
]

[tool.hatch.build.targets.wheel]
packages = ["project", "activities", "workflows", "schemas", "role_packs"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = ["scale-agentex", ".venv", "sdk", "deploy", "ui", "node_modules"]
