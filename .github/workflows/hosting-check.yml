name: Platform check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docs-and-invariants:
    name: Docs + FE structure invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Core docs + scaffold present
        run: |
          test -f docs/README.md
          test -f docs/architecture.md
          test -f docs/platform.md
          test -f docs/use-cases.md
          test -f docs/api.md
          test -f docs/deep-dives/swarm-factory.md
          test -f docs/platform/frontend-structure.md
          test -f apps/web/package.json
          test -f apps/web/src/App.tsx
          test ! -f deploy/vercel-deploy.sh
          test ! -d docs/hosting
          ! rg -n "Deploy your agent|bot marketplace" apps/web/src

  web-build:
    name: Web scaffold build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm install

      - name: Production build
        env:
          VITE_GANTRY_API_URL: http://localhost:8001
        run: npm run build

  api-cors:
    name: API CORS config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API deps
        run: pip install -q pytest python-dotenv

      - name: pytest CORS
        run: python -m pytest tests/test_cors_config.py -q
