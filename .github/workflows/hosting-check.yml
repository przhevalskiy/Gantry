name: Platform check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docs-and-invariants:
    name: Docs + API-first invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Core docs present
        run: |
          test -f docs/README.md
          test -f docs/architecture.md
          test -f docs/platform.md
          test -f docs/use-cases.md
          test -f docs/api.md
          test -f docs/deep-dives/swarm-factory.md
          test ! -d apps/web
          test ! -f deploy/vercel-deploy.sh
          test ! -d docs/hosting

  api-cors:
    name: API CORS config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install API deps
        run: pip install -q pytest python-dotenv

      - name: pytest CORS
        run: python -m pytest tests/test_cors_config.py -q
