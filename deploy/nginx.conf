# Monolift — Nginx config
# Domains:
#   api.monolift.dev  → Gantry API :8001
#   platform.monolift.dev → Agentex :5003

# Gantry API
server {
    listen 80;
    server_name api.monolift.dev;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name api.monolift.dev;

    ssl_certificate     /etc/letsencrypt/live/api.monolift.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.monolift.dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 10M;

    location / {
        proxy_pass         http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# Agentex platform (for UI streaming)
server {
    listen 80;
    server_name platform.monolift.dev;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name platform.monolift.dev;

    ssl_certificate     /etc/letsencrypt/live/platform.monolift.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/platform.monolift.dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 10M;

    location / {
        proxy_pass         http://127.0.0.1:5003;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
