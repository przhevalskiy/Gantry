apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gantry.fullname" . }}-secrets
  labels:
    {{- include "gantry.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.database.url | quote }}
  GANTRY_BOOTSTRAP_TOKEN: {{ .Values.env.GANTRY_BOOTSTRAP_TOKEN | quote }}
  GANTRY_SECRETS_KEY: {{ .Values.env.GANTRY_SECRETS_KEY | quote }}
  LINEAR_WEBHOOK_SECRET: {{ .Values.env.LINEAR_WEBHOOK_SECRET | quote }}
  JIRA_WEBHOOK_SECRET: {{ .Values.env.JIRA_WEBHOOK_SECRET | quote }}
  GITHUB_WEBHOOK_SECRET: {{ .Values.env.GITHUB_WEBHOOK_SECRET | quote }}
